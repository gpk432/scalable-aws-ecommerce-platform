services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - commerce-data:/var/lib/postgresql/data

  api:
    build: ./app
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/commerce
      DB_USERNAME: commerce
      DB_PASSWORD: commerce
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  commerce-data:
